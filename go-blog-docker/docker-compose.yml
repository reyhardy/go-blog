# Use postgres/example user/password credentials
services:

  db:
    image: postgres:16
    container_name: go-blog-postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql@16/data
      - ./init:/docker-entrypoint-initdb.d/
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: go_blog_user
      POSTGRES_PASSWORD: go_blog_password
      POSTGRES_DB: go_blog_db
    

